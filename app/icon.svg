<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MAPL Tours Jamaica">
  <!-- The Jamaican flag, flying from a pole.
       The lockup's bus is close to 4:1 and could only ever be a sliver or a
       crop inside a square favicon; the flag is the right shape to begin with
       and carries the same three colours. Flown rather than laid flat: the
       pole fills the height a 2:1 flag would otherwise waste, and the
       silhouette of pole-plus-cloth is recognisable at 16px even once the
       wave itself has dissolved into two or three pixels.

       Colours as flown: #000000, #FED100, #009B3A. The cloth is one clipping
       path sampled from a sine whose amplitude grows with distance from the
       pole — the way real cloth moves, still at the halyard and loose at the
       fly. The flag's own design is drawn straight underneath and clipped to
       that outline, so its edges ripple without the saltire having to be
       redrawn as curves. The pole is warm grey rather than gold: gold beside
       the gold saltire loses the pole, and grey holds on both a white and a
       dark tab. It is drawn heavy — a realistic thin staff renders as a
       sub-pixel smudge in a 16px tab — and the cloth sits flush against it,
       with no daylight between halyard and hoist.

       Sized to the frame: the fly edge stops 12 units short of the canvas,
       the staff 44 short of the left, and the finial 10 short of the top — as
       large as the mark goes with every part of it inside the box. The
       finial is the piece to watch when retuning: it is drawn from the pole's
       TOP, so its radius hangs above that line and clipped it the first time.

       The cloth is hoisted rather than slung amidships — its head rides just
       under the finial and the bare staff runs on below it, which is where a
       flown flag actually sits. The flag stays 2:1 — it reads thicker because the
       whole thing is bigger, not because it has been squashed. Nothing paints
       a background, so the tab's colour shows through. -->
